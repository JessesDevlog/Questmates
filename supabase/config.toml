# Supabase local / GitHub integration config
# See docs/SUPABASE_SETUP.md

project_id = "questmates"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost"
additional_redirect_urls = []

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
